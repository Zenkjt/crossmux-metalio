name: Metalio Audio Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metalio-audio-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_RETRIES: 10

jobs:
  select_runner:
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  build:
    name: Build Metalio E-Ink 4
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - name: Isolate PlatformIO toolchains
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Use runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.2.0

      - name: Prepare platform tools
        run: python scripts/patch_pioarduino_cache.py --prepare-platform

      - name: Cache PlatformIO packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}/.cache
          key: pio-cache-metalio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-metalio-${{ runner.os }}-

      - name: Build Metalio E-Ink 4
        run: |
          set -euo pipefail
          pio run -e metalio_eink4

      - name: Upload Metalio firmware
        uses: actions/upload-artifact@v4
        with:
          name: metalio-eink4-audio-test
          path: .pio/build/metalio_eink4/firmware.bin
          if-no-files-found: error
