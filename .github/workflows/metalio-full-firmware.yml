name: Metalio Full Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install Metalio audio dependency overlay
        run: |
          cp platformio.metalio-audio.ini platformio.local.ini

      - name: Vendor Opus 1.6.1
        run: |
          rm -rf lib/codec-opus
          mkdir -p lib/codec-opus
          git clone --depth 1 --branch v1.6.1             https://github.com/pschatzmann/codec-opus.git             /tmp/codec-opus
          cp -R /tmp/codec-opus/src/. lib/codec-opus/
          rm -f lib/codec-opus/library.properties
          rm -f lib/codec-opus/CMakeLists.txt
          rm -f lib/codec-opus/README.md

      - name: Vendor NimBLE-Arduino 2.3.8
        shell: bash
        run: |
          set -euo pipefail

          rm -rf lib/NimBLE-Arduino
          mkdir -p lib/NimBLE-Arduino

          python - <<'PY'
          from pathlib import Path

          for name in ("platformio.ini", "platformio.local.ini"):
              path = Path(name)
              if not path.exists():
                  continue

              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              filtered = [
                  line for line in lines
                  if "h2zero/NimBLE-Arduino" not in line.strip()
              ]
              path.write_text("".join(filtered), encoding="utf-8")
          PY

          git clone --depth 1 --branch 2.3.8 \
            https://github.com/h2zero/NimBLE-Arduino.git \
            /tmp/NimBLE-Arduino

          cp -a /tmp/NimBLE-Arduino/src/. lib/NimBLE-Arduino/

          rm -f lib/NimBLE-Arduino/library.properties
          rm -f lib/NimBLE-Arduino/CMakeLists.txt
          rm -f lib/NimBLE-Arduino/README.md

      - name: Build Metalio firmware
        run: |
          pio run -e metalio_eink4

      - name: Install esptool
        run: |
          pip install esptool

      - name: Locate boot_app0
        id: boot_app0
        shell: bash
        run: |
          BOOT_APP0="$(find . -type f -name boot_app0.bin | head -n 1)"
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin not found"
            exit 1
          fi
          echo "path=$BOOT_APP0" >> "$GITHUB_OUTPUT"

      - name: Assemble full flash image
        run: |
          BOOTLOADER=".pio/build/metalio_eink4/bootloader.bin"
          PARTITIONS=".pio/build/metalio_eink4/partitions.bin"
          FIRMWARE=".pio/build/metalio_eink4/firmware.bin"
          BOOT_APP0="${{ steps.boot_app0.outputs.path }}"

          for f in "$BOOTLOADER" "$PARTITIONS" "$FIRMWARE" "$BOOT_APP0"; do
            if [ ! -f "$f" ]; then
              echo "Missing required image: $f"
              exit 1
            fi
          done

          esptool merge_bin             -o metalio-eink4-full.bin             --chip esp32s3             --flash_mode dio             --flash_size 16MB             0x0000 "$BOOTLOADER"             0x8000 "$PARTITIONS"             0xe000 "$BOOT_APP0"             0x10000 "$FIRMWARE"

      - name: Generate SHA-256
        run: |
          sha256sum metalio-eink4-full.bin | tee metalio-eink4-full.bin.sha256
          sha256sum .pio/build/metalio_eink4/firmware.bin | tee metalio-eink4-firmware.bin.sha256

      - name: Upload full firmware
        uses: actions/upload-artifact@v4
        with:
          name: metalio-eink4-full-firmware
          path: |
            metalio-eink4-full.bin
            metalio-eink4-full.bin.sha256

      - name: Upload build components
        uses: actions/upload-artifact@v4
        with:
          name: metalio-eink4-build-components
          path: |
            .pio/build/metalio_eink4/bootloader.bin
            .pio/build/metalio_eink4/partitions.bin
            .pio/build/metalio_eink4/firmware.bin
            .pio/build/metalio_eink4/firmware.elf
            .pio/build/metalio_eink4/firmware.map
            .pio/build/metalio_eink4/firmware.bin.sha256
            metalio-eink4-firmware.bin.sha256
