name: Metalio Full Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Isolate PlatformIO toolchains
        run: |
          echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Use runner temporary directory
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install pioarduino
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip

      - name: Prepare pioarduino platform
        run: |
          python scripts/patch_pioarduino_cache.py --prepare-platform

      - name: Install Metalio audio dependency overlay
        run: |
          cp platformio.metalio-audio.ini platformio.local.ini

      - name: Build Metalio firmware
        run: |
          pio run -e metalio_eink4

      - name: Install esptool
        run: |
          pip install esptool

      - name: Locate boot_app0
        id: boot_app0
        shell: bash
        run: |
          set -euo pipefail

          BOOT_APP0="$(find . -type f -name boot_app0.bin | head -n 1)"

          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin not found"
            exit 1
          fi

          echo "path=$BOOT_APP0" >> "$GITHUB_OUTPUT"

      - name: Assemble full flash image
        run: |
          set -euo pipefail

          BOOTLOADER=".pio/build/metalio_eink4/bootloader.bin"
          PARTITIONS=".pio/build/metalio_eink4/partitions.bin"
          FIRMWARE=".pio/build/metalio_eink4/firmware.bin"
          BOOT_APP0="${{ steps.boot_app0.outputs.path }}"

          for f in "$BOOTLOADER" "$PARTITIONS" "$FIRMWARE" "$BOOT_APP0"; do
            if [ ! -f "$f" ]; then
              echo "Missing required image: $f"
              exit 1
            fi
          done

          esptool merge_bin \
            -o metalio-eink4-full.bin \
            --chip esp32s3 \
            --flash_mode dio \
            --flash_size 16MB \
            0x0000 "$BOOTLOADER" \
            0x8000 "$PARTITIONS" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$FIRMWARE"

      - name: Generate SHA-256
        run: |
          sha256sum metalio-eink4-full.bin \
            | tee metalio-eink4-full.bin.sha256

          sha256sum .pio/build/metalio_eink4/firmware.bin \
            | tee metalio-eink4-firmware.bin.sha256

      - name: Upload full firmware
        uses: actions/upload-artifact@v4
        with:
          name: metalio-eink4-full-firmware
          path: |
            metalio-eink4-full.bin
            metalio-eink4-full.bin.sha256

      - name: Upload build components
        uses: actions/upload-artifact@v4
        with:
          name: metalio-eink4-build-components
          path: |
            .pio/build/metalio_eink4/bootloader.bin
            .pio/build/metalio_eink4/partitions.bin
            .pio/build/metalio_eink4/firmware.bin
            .pio/build/metalio_eink4/firmware.elf
            .pio/build/metalio_eink4/firmware.map
            .pio/build/metalio_eink4/firmware.bin.sha256
            metalio-eink4-firmware.bin.sha256
