name: Metalio E-INK4 Full Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - "metalio/sc7a20h"

jobs:
  build-metalio-full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install Metalio audio dependency overlay
        run: cp platformio.metalio-audio.ini platformio.local.ini

      - name: Build Metalio E-INK4
        run: pio run -e metalio_eink4

      - name: Install esptool
        run: pip install esptool

      - name: Locate boot_app0
        id: boot_app0
        shell: bash
        run: |
          set -euo pipefail
          BOOT_APP0="$(find ~/.platformio -name boot_app0.bin -type f | head -n 1)"
          test -n "$BOOT_APP0"
          echo "path=$BOOT_APP0" >> "$GITHUB_OUTPUT"

      - name: Assemble complete flash image
        shell: bash
        run: |
          set -euo pipefail

          BUILD=".pio/build/metalio_eink4"
          BOOTLOADER="$BUILD/bootloader/bootloader.bin"
          PARTITIONS="$BUILD/partitions.bin"
          BOOT_APP0="${{ steps.boot_app0.outputs.path }}"
          FIRMWARE="$BUILD/firmware.bin"

          test -f "$BOOTLOADER"
          test -f "$PARTITIONS"
          test -f "$BOOT_APP0"
          test -f "$FIRMWARE"

          esptool merge_bin \
            -o "$BUILD/metalio-eink4-full.bin" \
            --flash_mode dio \
            --flash_size 16MB \
            0x0000 "$BOOTLOADER" \
            0x8000 "$PARTITIONS" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$FIRMWARE"

      - name: Generate SHA-256
        run: |
          sha256sum \
            .pio/build/metalio_eink4/metalio-eink4-full.bin \
            .pio/build/metalio_eink4/firmware.bin \
            > .pio/build/metalio_eink4/SHA256SUMS.txt

      - name: Upload full firmware
        uses: actions/upload-artifact@v4
        with:
          name: metalio-eink4-full-firmware
          path: |
            .pio/build/metalio_eink4/metalio-eink4-full.bin
            .pio/build/metalio_eink4/firmware.bin
            .pio/build/metalio_eink4/bootloader/bootloader.bin
            .pio/build/metalio_eink4/partitions.bin
            .pio/build/metalio_eink4/SHA256SUMS.txt
          if-no-files-found: error
